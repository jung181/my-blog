<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 블로그</title>
  <meta name="description" content="마크다운으로 쓰는 개인 블로그">
  <script>
    // 렌더링 전에 테마를 정해 깜빡임을 막는다
    (function () {
      let theme = null;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#app">본문으로 건너뛰기</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="#/">나의 블로그</a>
      <button class="theme-toggle" type="button" aria-label="다크 모드로 전환">
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1">
    <p class="status">불러오는 중…</p>
  </main>

  <!-- 메인(#/) 화면 위쪽에 보여줄 웹앱 카드. 새 웹앱은 여기에 <li class="app-card">를 추가한다 -->
  <template id="app-cards">
    <section class="apps" aria-labelledby="apps-title">
      <h1 class="page-title" id="apps-title">웹앱</h1>
      <p class="page-subtitle">직접 만든 미니 웹앱을 바로 사용해 보세요</p>
      <ul class="app-list">
        <li class="app-card">
          <article>
            <h2><a href="apps/2048/">2048</a></h2>
            <p class="description">방향키나 스와이프로 숫자 타일을 밀어 같은 수끼리 합치는 퍼즐 게임. 점수와 최고 점수를 기록합니다.</p>
            <div class="app-frame">
              <iframe src="apps/2048/" title="2048 게임 미리보기" loading="lazy"></iframe>
            </div>
            <a class="app-open" href="apps/2048/">전체 화면으로 열기 →</a>
          </article>
        </li>
      </ul>
    </section>
  </template>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> 나의 블로그</p>
    </div>
  </footer>

  <script>
    // 파일을 직접 열면(file://) 모듈 스크립트가 아예 실행되지 않으므로 여기서 안내한다
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML =
        '<h1 class="page-title">로컬 서버로 열어주세요</h1>' +
        '<div class="prose"><p>파일을 직접 열면 글을 불러올 수 없어요. 프로젝트 폴더에서 아래 명령을 실행한 뒤 ' +
        '<code>http://localhost:8000</code> 으로 접속하세요.</p>' +
        '<pre><code>python -m http.server 8000</code></pre></div>';
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
